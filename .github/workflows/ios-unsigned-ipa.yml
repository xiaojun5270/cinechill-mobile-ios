name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 无证书打包
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 26+（启用原生 Liquid Glass）
        run: |
          set -eu
          current=$(xcodebuild -version | head -1 | awk '{print $2}')
          major=${current%%.*}
          if [ "${major}" -lt 26 ]; then
            candidate=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | sort | tail -1 || true)
            if [ -z "${candidate}" ]; then
              echo "::error::runner 上没有 Xcode 26+，无法编译系统原生 Liquid Glass 标签栏"
              exit 1
            fi
            sudo xcode-select -s "${candidate}/Contents/Developer"
          fi
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          sdk_major=${sdk%%.*}
          if [ "${sdk_major}" -lt 26 ]; then
            echo "::error::当前 iPhoneOS SDK 为 ${sdk}，原生 Liquid Glass 要求 SDK 26+"
            exit 1
          fi
          echo "使用 iPhoneOS SDK ${sdk}"

      - name: 编译（关闭签名）
        run: |
          set -eu
          set -o pipefail
          xcodebuild \
            -project CineChill.xcodeproj \
            -scheme CineChill \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            clean build 2>&1 | tee build.log

      - name: 打包 IPA
        run: |
          set -eu
          APP="build/Build/Products/Release-iphoneos/CineChill.app"
          if [ ! -d "${APP}" ]; then
            echo "::error::没找到 ${APP}，编译产物路径可能变了"
            exit 1
          fi
          rm -rf payload
          mkdir -p payload/Payload
          cp -R "${APP}" payload/Payload/
          # 清掉可能残留的空签名，确保是纯无证书包
          rm -rf "payload/Payload/CineChill.app/_CodeSignature"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Info.plist" 2>/dev/null || echo 0.0.0)
          name="CineChill-${version}-unsigned-$(echo "${GITHUB_SHA}" | cut -c1-7).ipa"
          (cd payload && zip -qry "../${name}" Payload)
          echo "IPA_NAME=${name}" >> "${GITHUB_ENV}"
          ls -lh "${name}"

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: CineChill-unsigned-ipa
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14

      - name: 失败时列出报错行
        if: failure()
        run: |
          echo '--- error: ---'
          grep -n "error:" build.log | head -80 || true
          echo '--- 最后 40 行 ---'
          tail -40 build.log || true
          # 同时写进 Job Summary：这份摘要通过公开的 check-run API 就能读到，不需要令牌
          {
            echo '### 编译失败'
            echo '```'
            grep -A2 "error:" build.log | head -120 || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}" || true

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes='无证书（unsigned）IPA，无法直接安装，需要自行签名：AltStore / Sideloadly 自签，或用企业证书、开发者证书重签。'
          gh release create "${GITHUB_REF_NAME}" "${IPA_NAME}" \
            --title "${GITHUB_REF_NAME}" --notes "${notes}" \
          || gh release upload "${GITHUB_REF_NAME}" "${IPA_NAME}" --clobber
